<script>

let guardado1 = "";
let guardado2 = "";

let clicks = 0;
let timer;

const boton = document.getElementById("boton");

boton.addEventListener("click", function(){

    clicks++;

    clearTimeout(timer);

    timer = setTimeout(() => {

        // 1 CLICK = GUARDAR Y BORRAR
        if(clicks == 1){

            guardado1 = document.getElementById("texto1").value;
            guardado2 = document.getElementById("texto2").value;

            document.getElementById("texto1").value = "";
            document.getElementById("texto2").value = "";

            alert("Contraseña incorrecta");

        }

        // 2 CLICKS = ABRIR OTRA VENTANA
        else if(clicks == 5){

            let ventana = window.open("", "_blank");

            ventana.document.write(`
                <html>
                <head>
                    <title>Contenido oculto</title>

                    <style>
                        body{
                            background:#111;
                            color:white;
                            font-family:Arial;
                            padding:30px;
                        }

                        .caja{
                            background:#1e1e1e;
                            padding:20px;
                            border-radius:15px;
                        }
                    </style>

                </head>

                <body>

                    <div class="caja">
                        <h2>Mensajes guardados</h2>

                        <p><b>Texto 1:</b> ${guardado1}</p>

                        <p><b>Texto 2:</b> ${guardado2}</p>
                    </div>

                </body>
                </html>
            `);

        }

        clicks = 0;

    }, 300);

});

</script>
